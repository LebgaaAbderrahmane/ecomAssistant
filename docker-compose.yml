services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  back:
    build:
      context: .
      dockerfile: back/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  agent:
    build:
      context: ./ecom_agent
    restart: unless-stopped
    # Internal only — no host port. The backend reaches it as `agent:50052`
    # over the default Compose network (see AGENT_GRPC_ADDR / TOOLS_GRPC_ADDR).
    env_file: .env
    environment:
      AGENT_GRPC_ADDR: 0.0.0.0:50052
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      back:
        condition: service_started
    healthcheck:
      # M1: process-alive placeholder. Task 4 replaces this with a real
      # AgentService.Health gRPC probe.
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file: .env
    depends_on:
      - back

  openwa:
    build:
      context: ./OpenWA
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "2785:2785"
    environment:
      - QUEUE_ENABLED=false
      - ALLOW_DEV_API_KEY=true
      - ENGINE_TYPE=baileys
      - SSRF_ALLOWED_HOSTS=back
    volumes:
      - openwa_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2785/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  openwa_data:
