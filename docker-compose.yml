services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  back:
    build:
      context: .
      dockerfile: back/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - .:/app
      - /app/node_modules
    env_file: .env
    environment:
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file: .env
    depends_on:
      - back

  openwa:
    build:
      context: ./OpenWA
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "2785:2785"
    environment:
      - QUEUE_ENABLED=false
      - ALLOW_DEV_API_KEY=true
      - ENGINE_TYPE=baileys
      - SSRF_ALLOWED_HOSTS=back
    volumes:
      - openwa_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2785/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  openwa_data:
